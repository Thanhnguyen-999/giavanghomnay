# Các package TypeScript. apps/mobile (Flutter) không thuộc pnpm.
packages:
  - apps/web
  - apps/admin
  - services/*
  - packages/*

# pnpm chặn script cài đặt của dependency theo mặc định. Chỉ cho phép package cần thiết:
#   esbuild – tải binary bundler (wrangler dùng để build Worker)
#   workerd – runtime Workers chạy local (wrangler dev, D1 --local)
allowBuilds:
  esbuild: true
  workerd: true
  # sharp bị kéo vào gián tiếp (image), test không cần → không chạy script.
  sharp: false

# pnpm tự thêm: các bản được pin mới phát hành, chưa qua thời gian chờ minimumReleaseAge.
minimumReleaseAgeExclude:
  - miniflare@5.20261006.2-beta
  - wrangler@4.150.0
