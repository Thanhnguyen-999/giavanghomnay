name = "gold-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Origin được phép gọi API từ trình duyệt (web công khai + admin). Ngăn cách bằng dấu phẩy.
CORS_ORIGINS = "https://thanhnguyen-999.github.io"
# Môi trường. "dev" cho phép ADMIN_DEV_EMAIL bỏ qua Access; "production" thì KHÔNG.
ENVIRONMENT = "production"
# Cloudflare Access (điền sau khi tạo Access application; không bí mật).
#   ACCESS_TEAM_DOMAIN = "https://<team>.cloudflareaccess.com"
#   ACCESS_AUD         = "<Application Audience tag>"
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
# ADMIN_DEV_EMAIL chỉ đặt ở .dev.vars cho local; production để trống.
# Xác thực tạm bằng token (dùng khi chưa gắn được Access). Email gắn với token:
ADMIN_TOKEN_EMAIL = "thanhadhp2000@gmail.com"
# Secret ADMIN_TOKEN đặt bằng: npx wrangler secret put ADMIN_TOKEN

[[d1_databases]]
binding = "DB"
database_name = "gold-db"
# gold-db (region APAC), tạo bằng: npx wrangler d1 create gold-db
# Local dev (--local) dùng DB SQLite riêng, không đụng id này.
database_id = "3f0e7ed1-6268-4cd7-badc-f54a9619bc66"
migrations_dir = "migrations"

# Snapshot giá mới nhất + cache nhỏ. Local (--local) dùng KV local, không đụng id này.
[[kv_namespaces]]
binding = "CACHE"
id = "ae07733755164ba3aa207867a2571079"

# Mỗi message = 1 nguồn đến hạn crawl.
# Tạo queue thật: npx wrangler queues create crawl-jobs ; npx wrangler queues create crawl-jobs-dlq
[[queues.producers]]
binding = "CRAWL_QUEUE"
queue = "crawl-jobs"

[[queues.consumers]]
queue = "crawl-jobs"
max_batch_size = 5
max_batch_timeout = 10
max_retries = 2
dead_letter_queue = "crawl-jobs-dlq"

# Scheduler chạy mỗi phút, chọn nguồn tới hạn theo interval_sec của từng nguồn.
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true

# Admin SPA tĩnh (build từ apps/admin vào public/admin). API route chạy trước,
# path không khớp route → phục vụ file tĩnh; thiếu file → index.html của SPA.
[assets]
directory = "./public"
not_found_handling = "single-page-application"
run_worker_first = ["/v1/*", "/admin/v1/*", "/health", "/cdn-cgi/*"]

# R2, alerts queue thêm ở Phase sau (xem ai_docs/architecture.md mục 4).
# Secret không ghi vào file này: dùng `npx wrangler secret put <NAME>`; local dùng .dev.vars.
